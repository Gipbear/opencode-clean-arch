name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Verify prebuilt dist/ matches src/
        run: npm run check:dist

      - name: Typecheck & run tests
        run: |
          npm run typecheck
          npm test

      - name: Verify git tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VER" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VER"
            exit 1
          fi

      - name: Publish to public npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
