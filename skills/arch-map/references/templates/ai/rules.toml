# Checked by: arch_facts.py check (or the clean_arch_facts tool with command "check").
# Module patterns are dotted names with fnmatch wildcards: "pkg.sub.*" also matches "pkg.sub".

# Top-level keys must come before the first [table].
# Fail on any package-level import cycle.
no_cycles = true

# Flat layers from top to bottom (3 layers recommended).
# A module may import from its own layer or any layer below it, never above it.
[[layers]]
name = "entry_and_spine"
modules = ["scripts.*", "pkg.cli.*", "pkg.api.*", "pkg.pipeline*"]

[[layers]]
name = "domain"
modules = ["pkg.core.*", "pkg.domain.*", "pkg.models*"]

[[layers]]
name = "infrastructure"
modules = ["pkg.infra.*", "pkg.io.*", "pkg.clients.*", "pkg.config*"]

# Forbidden imports (supports both internal modules and external packages like requests*, fastapi*).
[[forbid]]
from = "pkg.core.*"
to = "requests*"
reason = "domain logic must stay pure; keep HTTP calls in infrastructure"

[[forbid]]
from = "pkg.core.*"
to = "torch.distributed*"
reason = "core logic must run without a cluster"

# Budgets: the project's stated limits if it has any, otherwise these defaults. Say which here.
# Exempt vendored, legacy and original-paper code.
[budgets]
max_module_lines = 600
max_function_lines = 80
max_params = 6
max_nesting = 4
exempt = ["pkg.generated.*"]
